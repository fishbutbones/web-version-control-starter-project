<!doctype html>
<html lang="en">
  <head>
    <title>About Me</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Using Bootstrap 5 framework -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- jQuery used to load the navbar -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  </head>

  <body>
    <!-- Navbar gets added here -->
    <div id="nav-placeholder"></div>

    <!-- Introduction to web building -->
    <div class="container">
      <div class="card">
        <div class="card-header">
          <h1>My Fishtank</h1>
        </div>
        <div class="card-body">
          <p>Fish I have in my fishtank:</p>
          <ul class="list-group">
            <li class="list-group-item">Albino Corydoras</li>
            <li class="list-group-item">Bronze Corydoras</li>
            <li class="list-group-item">Peppered Corydoras</li>
            <li class="list-group-item">Panda Corydoras</li>
          </ul>
        </div>
      </div>
    </div>
    <script>
      // Load only the #site-nav element from navbar.html
      $("#nav-placeholder").load("navbar.html #site-nav");
    </script>
  </body>
</html>
